<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>車商會員管理｜橙築</title>
<link rel="stylesheet" href="app.css">
<style>
  .login{padding:38px 22px;max-width:420px;margin:0 auto}
  /* 後台：桌機網頁版型（覆蓋 app.css 的手機 460px 限制；前台 LIFF 頁不受影響） */
  .app{max-width:1080px}
  #list{display:grid;grid-template-columns:1fr;gap:12px}
  #list .dcard{margin-bottom:0}
  #list .empty{grid-column:1/-1}
  @media (min-width:720px){ #list{grid-template-columns:repeat(2,1fr)} .modal{align-items:center} .sheet{border-radius:16px;max-width:640px} }
  @media (min-width:1040px){ #list{grid-template-columns:repeat(3,1fr)} }
  .anav{display:flex;gap:8px;padding:10px 16px 0}
  .anav a{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px}
  .anav a.on{color:#1a1306;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));border-color:transparent}
  .toolbar{display:flex;gap:8px;padding:12px 16px 4px}
  .toolbar input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font);font-size:13px}
  .toolbar input:focus{outline:none;border-color:var(--gold-deep)}
  .toolbar .exp{background:var(--surface2);color:var(--gold-bright);border:1px solid var(--gold-deep);border-radius:10px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font);white-space:nowrap}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
  .dcard:hover{border-color:var(--gold-deep);transform:translateY(-2px);box-shadow:0 14px 28px -20px rgba(0,0,0,.8)}
  .dtap{color:var(--gold-bright);font-weight:700;font-size:12px;margin-top:10px}
  .dh{font-size:18px;font-weight:800;color:var(--text);line-height:1.3}
  .dstatus{font-size:13px;color:var(--muted);margin:6px 0 2px;font-weight:700}
  .dmeta-lg{font-size:14px;gap:7px 14px}
  .seclab2{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;margin:16px 0 8px}
  .dcard-card.big img{height:220px}
  .dcard h3{font-size:16px;font-weight:800;color:var(--text);line-height:1.3}
  .tier{font-size:10px;color:#1a1306;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));border-radius:5px;padding:2px 7px;font-weight:800;vertical-align:middle;margin-left:6px}
  .dmeta{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:11px;font-size:13px}
  .dmeta .k{color:var(--muted);white-space:nowrap}
  .dmeta .v{color:var(--text);font-weight:600;word-break:break-all}
  .dcard-note{margin-top:9px;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
  .dcard-card{margin-top:10px}
  .dcard-card img{height:120px;width:auto;max-width:100%;border-radius:8px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in;display:block}
  .dtime{font-size:11px;color:var(--muted2);margin-top:9px}
  .dactions{display:flex;gap:10px;margin-top:12px}
  .dactions button{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:14px;font-family:var(--font);cursor:pointer}
  .dactions.sub{margin-top:8px}
  .ok{background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#1a1306}
  .no{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .mini{background:var(--surface2);color:var(--muted);border:1px solid var(--line);font-size:13px;font-weight:700}
  .mini.danger{color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:52px 20px;font-size:14px}
  .logout{font-size:11px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:5px 11px}
  .hint{color:var(--muted2);font-size:12px;margin-top:14px;line-height:1.65}
  .hint code{color:var(--gold);background:var(--surface2);padding:1px 5px;border-radius:4px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:460px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .sheet h3{font-size:16px;font-weight:800;margin-bottom:14px;color:var(--gold-bright)}
  .sheet select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--text);font-family:var(--font);font-size:14px}
  .sheet textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--text);font-family:var(--font);font-size:14px;resize:vertical;line-height:1.55;box-sizing:border-box}
  .sheet textarea:focus{outline:none;border-color:var(--gold-deep)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">OB</div>
      <div><b>車商會員管理</b><small>ORANGE BUILDING MOTOR</small></div>
    </div>
    <div class="logout" id="logout" style="display:none" onclick="logout()">登出</div>
  </div>

  <div id="login" class="login" style="display:none">
    <div id="cfgwarn" style="display:none;background:#3a1414;border:1px solid var(--red);color:#ffb4b4;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:16px;line-height:1.65">⚠️ 偵測到後台密碼尚未設定。請先在電腦資料夾 chengzhu-CARS 執行 <code>npx wrangler secret put ADMIN_TOKEN</code>，設定後再登入。</div>
    <div class="field">
      <label>後台密碼</label>
      <input id="pw" type="password" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="submit-btn" onclick="doLogin()">登入</button>
  </div>

  <div id="main" style="display:none">
    <div class="anav">
      <a href="admin.html" class="on">👤 會員管理</a>
      <a href="admin-cars.html">🚗 車源管理</a>
      <a href="admin-orders.html">📦 訂單管理</a>
    </div>
    <div id="notifyBanner" style="display:none;margin:10px 16px 0;background:linear-gradient(160deg,#1d1a10,#141417);border:1px solid var(--gold-deep);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--gold-bright);line-height:1.7">
      🔔 想收到新申請／下訂的 LINE 通知？用<b>手機 LINE</b> 開啟綁定頁，輸入一次密碼即可（密碼不進聊天）：<br>
      <a href="https://liff.line.me/2010475696-IrFQfA6v?p=admin-bind" style="color:var(--gold-bright);text-decoration:underline;word-break:break-all">https://liff.line.me/2010475696-IrFQfA6v?p=admin-bind</a>
    </div>
    <div class="toolbar">
      <input id="q" placeholder="🔍 搜尋公司 / 統編 / 聯絡人 / 電話" oninput="debouncedLoad()">
      <button class="exp" onclick="exportCsv()">⬇ 匯出</button>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-st="pending" onclick="switchTab('pending')">待審核<span class="n" id="n-pending"></span></div>
      <div class="tab" data-st="verified" onclick="switchTab('verified')">已通過<span class="n" id="n-verified"></span></div>
      <div class="tab" data-st="suspended" onclick="switchTab('suspended')">已停權<span class="n" id="n-suspended"></span></div>
    </div>
    <div id="list" style="padding:12px 16px 44px"></div>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeEdit()">
  <div class="sheet">
    <h3>編輯車商</h3>
    <div class="field"><label>公司 / 商號</label><input id="e_company"></div>
    <div class="field"><label>統一編號</label><input id="e_tax" inputmode="numeric"></div>
    <div class="field"><label>聯絡人</label><input id="e_contact"></div>
    <div class="field"><label>電話</label><input id="e_phone" inputmode="tel"></div>
    <div class="field"><label>分級</label><select id="e_tier"><option value="standard">一般 standard</option><option value="vip">VIP</option></select></div>
    <div class="field"><label>備註</label><textarea id="e_note" rows="3" placeholder="車商備註（選填）"></textarea></div>
    <div class="dactions">
      <button class="ok" onclick="saveEdit()">儲存</button>
      <button class="no" onclick="closeEdit()">取消</button>
    </div>
  </div>
</div>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()">
  <div class="sheet" id="detailSheet">
    <div id="detailBody"></div>
  </div>
</div>

<script>
  const TKEY = 'cz_admin';
  let TAB = 'pending', CUR = [], EDIT_ID = null, _t = null;
  const tok = () => { try { return sessionStorage.getItem(TKEY) || ''; } catch (e) { return ''; } };
  const val = (id) => document.getElementById(id).value.trim();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

  function show(view) {
    document.getElementById('login').style.display = view === 'login' ? '' : 'none';
    document.getElementById('main').style.display = view === 'main' ? '' : 'none';
    document.getElementById('logout').style.display = view === 'main' ? '' : 'none';
  }
  function doLogin() {
    const v = document.getElementById('pw').value.trim();
    if (!v) return;
    try { sessionStorage.setItem(TKEY, v); } catch (e) {}
    boot();
  }
  function logout() { try { sessionStorage.removeItem(TKEY); } catch (e) {} document.getElementById('pw').value = ''; show('login'); }

  async function api(path, opts) {
    const o = opts || {};
    o.headers = Object.assign({ 'X-Admin-Token': tok() }, o.headers || {});
    const r = await fetch(path, o);
    if (r.status === 401) { logout(); throw new Error('密碼錯誤，或後台密碼（ADMIN_TOKEN）尚未設定'); }
    if (!r.ok) throw new Error('伺服器錯誤（' + r.status + '）');
    return r;
  }

  function metaRow(k, v) { return v ? `<div class="k">${k}</div><div class="v">${v}</div>` : ''; }
  function actionsHtml(d) {
    let primary = '';
    if (d.status === 'pending') primary = `<button class="ok" onclick="approve('${d.id}')">✓ 通過</button><button class="no" onclick="reject('${d.id}')">婉拒</button>`;
    else if (d.status === 'verified') primary = `<button class="no" onclick="reject('${d.id}')">停權</button>`;
    else primary = `<button class="ok" onclick="approve('${d.id}')">恢復通過</button>`;
    return `<div class="dactions">${primary}</div>
      <div class="dactions sub">
        <button class="mini" onclick="openEdit('${d.id}')">✎ 編輯</button>
        <button class="mini danger" onclick="del('${d.id}')">刪除</button>
      </div>`;
  }
  function imgURL(u){ return (u && !/^(https?:\/\/|\/)/.test(u)) ? '/'+u : u; }
  function card(d) {
    const tierBadge = (d.tier && d.tier !== 'standard') ? `<span class="tier">${esc(d.tier).toUpperCase()}</span>` : '';
    const vtime = d.status === 'verified' ? `<div class="dtime">✅ 通過於 ${esc(d.verified_at) || '—'}</div>` : '';
    const brands = (Array.isArray(d.brands) && d.brands.length) ? metaRow('收車類型', esc(d.brands.join('、'))) : '';
    const hasCard = d.business_card ? '　·　📎 附名片' : '';
    // 整張卡片可點 → 開「車商資訊」視窗（內含審核 / 編輯按鈕）
    return `<div class="dcard" onclick="openDetail('${d.id}')">
      <h3>${esc(d.company_name) || '（未填公司名）'}${tierBadge}</h3>
      <div class="dmeta">
        ${metaRow('統一編號', esc(d.tax_id))}
        ${metaRow('聯絡人', esc(d.contact_name))}
        ${metaRow('電話', esc(d.phone))}
        ${brands}
      </div>
      <div class="dtime">申請於 ${esc(d.created_at) || '—'}${hasCard}</div>
      ${vtime}
      <div class="dtap">點卡片查看 / 審核 ›</div>
    </div>`;
  }

  async function loadList() {
    try {
      const q = (document.getElementById('q').value || '').trim();
      const r = await api('/api/admin/dealers?status=' + TAB + (q ? '&q=' + encodeURIComponent(q) : ''));
      CUR = await r.json();
      document.getElementById('n-' + TAB).textContent = CUR.length ? ' ' + CUR.length : '';
      const labels = { pending: '目前沒有待審核的車商', verified: '尚無已通過車商', suspended: '尚無已停權車商' };
      document.getElementById('list').innerHTML = CUR.length ? CUR.map(card).join('') : `<div class="empty">${q ? '查無符合「' + esc(q) + '」的車商' : labels[TAB]}</div>`;
    } catch (e) { alert(e.message); }
  }
  function debouncedLoad() { clearTimeout(_t); _t = setTimeout(loadList, 250); }
  function switchTab(st) {
    TAB = st;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.st === st));
    loadList();
  }

  async function approve(id) {
    try { await api('/api/admin/dealers/' + id + '/approve', { method: 'POST' }); loadList(); } catch (e) { alert(e.message); }
  }
  async function reject(id) {
    const d = CUR.find(x => x.id === id) || {};
    if (!confirm('確定要停權 / 婉拒「' + (d.company_name || '此車商') + '」？對方將看不到批發價。')) return;
    try { await api('/api/admin/dealers/' + id + '/reject', { method: 'POST' }); loadList(); } catch (e) { alert(e.message); }
  }
  async function del(id) {
    const d = CUR.find(x => x.id === id) || {};
    if (!confirm('確定刪除「' + (d.company_name || '此車商') + '」？此動作無法復原。')) return;
    try { await api('/api/admin/dealers/' + id + '/delete', { method: 'POST' }); loadList(); } catch (e) { alert(e.message); }
  }

  function openEdit(id) {
    const d = CUR.find(x => x.id === id); if (!d) return;
    EDIT_ID = id;
    document.getElementById('e_company').value = d.company_name || '';
    document.getElementById('e_tax').value = d.tax_id || '';
    document.getElementById('e_contact').value = d.contact_name || '';
    document.getElementById('e_phone').value = d.phone || '';
    document.getElementById('e_tier').value = (d.tier === 'vip') ? 'vip' : 'standard';
    document.getElementById('e_note').value = d.note || '';
    document.getElementById('modal').style.display = 'flex';
  }
  function closeEdit() { document.getElementById('modal').style.display = 'none'; EDIT_ID = null; }

  // ───── 車商資訊視窗（點卡片開啟，內含審核 / 編輯按鈕；資料用已載入的 CUR，不再打 API）─────
  let DETAIL_ID = null;
  function detailHTML(d) {
    const tierBadge = (d.tier && d.tier !== 'standard') ? `<span class="tier">${esc(d.tier).toUpperCase()}</span>` : '';
    const phone = d.phone ? `<a href="tel:${esc(d.phone)}" style="color:var(--gold-bright)">${esc(d.phone)}</a>` : '';
    const brands = (Array.isArray(d.brands) && d.brands.length) ? metaRow('收車類型', esc(d.brands.join('、'))) : '';
    const vtime = d.status === 'verified' ? metaRow('通過時間', esc(d.verified_at)) : '';
    const note = d.note ? `<div class="dcard-note">📝 ${esc(d.note)}</div>` : '';
    const cardImg = d.business_card
      ? `<div class="seclab2">名片 / 營登照片（點圖放大）</div><div class="dcard-card big"><img src="${esc(imgURL(d.business_card))}" alt="名片／營登照片" onclick="window.open('${esc(imgURL(d.business_card))}','_blank')"></div>`
      : '';
    const stMap = { pending: '🟡 待審核', verified: '🟢 已通過', suspended: '🔴 已停權' };
    let primary = '';
    if (d.status === 'pending') primary = `<button class="ok" onclick="approve('${d.id}');closeDetail()">✓ 通過</button><button class="no" onclick="reject('${d.id}');closeDetail()">婉拒</button>`;
    else if (d.status === 'verified') primary = `<button class="no" onclick="reject('${d.id}');closeDetail()">停權</button>`;
    else primary = `<button class="ok" onclick="approve('${d.id}');closeDetail()">恢復通過</button>`;
    return `
      <h3 class="dh">${esc(d.company_name) || '（未填公司名）'}${tierBadge}</h3>
      <div class="dstatus">${stMap[d.status] || esc(d.status)}</div>
      <div class="dmeta dmeta-lg">
        ${metaRow('統一編號', esc(d.tax_id))}
        ${metaRow('聯絡人', esc(d.contact_name))}
        ${metaRow('電話', phone)}
        ${brands}
        ${metaRow('申請時間', esc(d.created_at))}
        ${vtime}
      </div>
      ${note}
      ${cardImg}
      <div class="dactions" style="margin-top:16px">${primary}</div>
      <div class="dactions sub">
        <button class="mini" onclick="editFromDetail()">✎ 編輯</button>
        <button class="mini danger" onclick="del('${d.id}');closeDetail()">刪除</button>
        <button class="mini" onclick="closeDetail()">關閉</button>
      </div>`;
  }
  function openDetail(id) {
    const d = CUR.find(x => x.id === id); if (!d) return;
    DETAIL_ID = id;
    document.getElementById('detailBody').innerHTML = detailHTML(d);
    document.getElementById('detailModal').style.display = 'flex';
    document.getElementById('detailSheet').scrollTop = 0;
  }
  function closeDetail() { document.getElementById('detailModal').style.display = 'none'; DETAIL_ID = null; }
  function editFromDetail() { const id = DETAIL_ID; closeDetail(); openEdit(id); }
  async function saveEdit() {
    if (!EDIT_ID) return;
    const body = { company_name: val('e_company'), tax_id: val('e_tax'), contact_name: val('e_contact'), phone: val('e_phone'), tier: document.getElementById('e_tier').value, note: val('e_note') };
    try { await api('/api/admin/dealers/' + EDIT_ID + '/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); closeEdit(); loadList(); }
    catch (e) { alert(e.message); }
  }

  function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
  function exportCsv() {
    if (!CUR.length) { alert('目前清單沒有資料可匯出'); return; }
    const stZh = { pending: '待審核', verified: '已通過', suspended: '已停權' };
    const head = ['公司名稱', '統一編號', '聯絡人', '電話', '狀態', '分級', '申請時間', '通過時間'];
    const rows = CUR.map(d => [d.company_name, d.tax_id, d.contact_name, d.phone, stZh[d.status] || d.status, d.tier, d.created_at, d.verified_at]);
    const csv = '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = '車商名單_' + TAB + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  async function checkConfig() {
    try { const r = await fetch('/api/config'); if (r.ok) { const j = await r.json(); document.getElementById('cfgwarn').style.display = j.adminConfigured ? 'none' : ''; } } catch (e) {}
  }
  async function checkNotify() {
    try { const r = await fetch('/api/admin/notify-status', { headers: { 'X-Admin-Token': tok() } }); if (r.ok) { const j = await r.json(); document.getElementById('notifyBanner').style.display = j.bound ? 'none' : ''; } } catch (e) {}
  }
  function boot() {
    if (!tok()) { show('login'); checkConfig(); return; }
    show('main');
    loadList();
    checkNotify();
  }
  boot();
</script>
</body>
</html>
