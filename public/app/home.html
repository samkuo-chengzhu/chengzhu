<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>橙築車商批發｜官方帳號</title>
<link rel="stylesheet" href="app.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">OB</div>
      <div><b>橙築國際汽車</b><small>ORANGE BUILDING MOTOR</small></div>
    </div>
    <div class="dealer-tag" id="idtag">🔒 車商批發</div>
  </div>

  <div class="oa-chat" id="chat" style="min-height:0"></div>

  <div class="cta" style="flex-direction:column;gap:10px">
    <button class="btn btn-primary" style="width:100%;flex:none" onclick="location.href='list.html'">🚗 瀏覽批發車源</button>
    <button class="btn btn-ghost" id="applyBtn" style="width:100%;flex:none" onclick="location.href='apply.html'">⭐ 申請成為車商</button>
  </div>

  <div class="foot">
    <div class="fl">橙築國際汽車</div>
    <div class="fs">ORANGE BUILDING MOTOR</div>
    <p>日本 · 韓國進口車・車商專屬批發<br>批發底價僅向已驗證車商顯示</p>
  </div>
</div>

<script src="app.js"></script>
<script>
  function renderChat() {
    const r = getRole();
    const B = {
      guest: `歡迎加入【橙築車商批發】👋<br>您目前是一般訪客，可瀏覽各狀態車源（<b>批發價隱藏</b>）。申請成為車商並通過審核後，即可看到批發底價並線上詢價。`,
      pending: `您的車商申請<b>審核中</b> ⏳<br>通常 1 個工作天完成，通過後將自動開通批發專區、解鎖所有批發價。`,
      dealer: `歡迎回來 🎉<br>批發底價已對您開放，點下方瀏覽批發車源。`,
    };
    document.getElementById('chat').innerHTML = `<div class="bubble">${B[r] || B.guest}</div>`;
    const dealer = isDealer();
    document.getElementById('idtag').textContent = dealer ? '🔓 已開通' : '🔒 車商批發';
    if (dealer) { const ab = document.getElementById('applyBtn'); if (ab) ab.style.display = 'none'; }
  }
  bootstrap().then(renderChat);
</script>
</body>
</html>
