<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>訂單管理｜橙築</title>
<link rel="stylesheet" href="app.css">
<style>
  .login{padding:38px 22px;max-width:420px;margin:0 auto}
  .app{max-width:1100px}
  #list{display:grid;grid-template-columns:1fr;gap:12px}
  #list .empty{grid-column:1/-1}
  @media (min-width:760px){ #list{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1140px){ #list{grid-template-columns:repeat(3,1fr)} }
  .anav{display:flex;gap:8px;padding:10px 16px 0}
  .anav a{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px}
  .anav a.on{color:#1a1306;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));border-color:transparent}
  .toolbar{display:flex;gap:8px;padding:12px 16px 4px}
  .toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font);font-size:13px;flex:1}
  .toolbar select:focus{outline:none;border-color:var(--gold-deep)}
  .ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
  .ocard:hover{border-color:var(--gold-deep);transform:translateY(-2px);box-shadow:0 14px 28px -20px rgba(0,0,0,.8)}
  .otap{color:var(--gold-bright);font-weight:700;font-size:12px;margin-top:11px}
  .ocard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ocard h3{font-size:15px;font-weight:800;line-height:1.3}
  .stbadge{font-size:11px;font-weight:800;color:#15130a;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .ometa{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:11px;font-size:13px}
  .ometa .k{color:var(--muted);white-space:nowrap}
  .ometa .v{color:var(--text);font-weight:600}
  .oact{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .oact button{flex:1;min-width:84px;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:800;font-family:var(--font);cursor:pointer}
  .ok{background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#1a1306}
  .no{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .term{font-size:12px;color:var(--muted2);margin-top:11px}
  .empty{text-align:center;color:var(--muted);padding:52px 20px;font-size:14px}
  .logout{font-size:11px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:5px 11px}
  /* 訂單詳情視窗（點卡片開啟） */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:460px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  @media (min-width:760px){ .modal{align-items:center} .sheet{border-radius:16px} }
  .oh{font-size:17px;font-weight:800;color:var(--text);line-height:1.3}
  .ometa-lg{font-size:14px;gap:7px 14px}
  .seclab3{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;margin:16px 0 10px}
  .fullbtn{width:100%;margin-top:10px;border-radius:9px;padding:11px;font-weight:800;font-size:14px;font-family:var(--font);cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">OB</div>
      <div><b>訂單管理</b><small>ORANGE BUILDING MOTOR</small></div>
    </div>
    <div class="logout" id="logout" style="display:none" onclick="logout()">登出</div>
  </div>

  <div id="login" class="login" style="display:none">
    <div class="field">
      <label>後台密碼</label>
      <input id="pw" type="password" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="submit-btn" onclick="doLogin()">登入</button>
  </div>

  <div id="main" style="display:none">
    <div class="anav">
      <a href="admin.html">👤 會員管理</a>
      <a href="admin-cars.html">🚗 車源管理</a>
      <a href="admin-orders.html" class="on">📦 訂單管理</a>
    </div>
    <div class="toolbar">
      <select id="f" onchange="loadList()">
        <option value="">全部訂單</option>
        <option value="locked">鎖車中</option>
        <option value="confirmed">已確認</option>
        <option value="deposit_paid">已收訂金</option>
        <option value="completed">已交車</option>
        <option value="cancelled">已取消</option>
      </select>
    </div>
    <div id="list" style="padding:12px 16px 44px"></div>
  </div>
</div>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()">
  <div class="sheet" id="detailSheet">
    <div id="detailBody"></div>
  </div>
</div>

<script>
  const TKEY = 'cz_admin';
  const ST = {
    locked: { l: '鎖車中', c: '#e0a13a' },
    confirmed: { l: '已確認', c: '#4a90e2' },
    deposit_paid: { l: '已收訂金', c: '#3fb6b0' },
    completed: { l: '已交車', c: '#3fae6b' },
    cancelled: { l: '已取消', c: '#888' },
  };
  // 各狀態可推進的下一步：[目標狀態, 按鈕字, 樣式]
  const NEXT = {
    locked: [['confirmed', '✓ 確認接單', 'ok'], ['cancelled', '取消', 'no']],
    confirmed: [['deposit_paid', '已收訂金', 'ok'], ['completed', '完成交車', 'ok'], ['cancelled', '取消', 'no']],
    deposit_paid: [['completed', '完成交車', 'ok'], ['cancelled', '取消', 'no']],
    completed: [],
    cancelled: [],
  };
  let CUR = [];
  const tok = () => { try { return sessionStorage.getItem(TKEY) || ''; } catch (e) { return ''; } };
  const g = id => document.getElementById(id);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
  function nt(n) { return (n == null) ? '—' : 'NT$ ' + Number(n).toLocaleString('en-US'); }

  function show(v) { g('login').style.display = v === 'login' ? '' : 'none'; g('main').style.display = v === 'main' ? '' : 'none'; g('logout').style.display = v === 'main' ? '' : 'none'; }
  function doLogin() { const v = g('pw').value.trim(); if (!v) return; try { sessionStorage.setItem(TKEY, v); } catch (e) {} boot(); }
  function logout() { try { sessionStorage.removeItem(TKEY); } catch (e) {} g('pw').value = ''; show('login'); }

  async function api(path, opts) {
    const o = opts || {}; o.headers = Object.assign({ 'X-Admin-Token': tok() }, o.headers || {});
    const r = await fetch(path, o);
    if (r.status === 401) { logout(); throw new Error('密碼錯誤，或後台密碼尚未設定'); }
    if (!r.ok) throw new Error('伺服器錯誤（' + r.status + '）');
    return r;
  }

  function card(o) {
    const st = ST[o.status] || { l: o.status, c: '#888' };
    // 整張卡片可點 → 開「訂單詳情」視窗（內含推進狀態按鈕）
    return `<div class="ocard" onclick="openDetail('${o.id}')">
      <div class="top">
        <h3>${esc(o.model_year)} ${esc(o.brand)} ${esc(o.model)}</h3>
        <span class="stbadge" style="background:${st.c}">${st.l}</span>
      </div>
      <div class="ometa">
        <div class="k">車商</div><div class="v">${esc(o.company_name)}</div>
        <div class="k">訂金</div><div class="v">${nt(o.deposit_twd)}</div>
      </div>
      <div class="otap">點卡片查看 / 推進狀態 ›</div>
    </div>`;
  }

  async function loadList() {
    try {
      const f = g('f').value;
      const r = await api('/api/admin/orders' + (f ? '?status=' + f : ''));
      CUR = await r.json();
      g('list').innerHTML = CUR.length ? CUR.map(card).join('') : `<div class="empty">${f ? '這個狀態目前沒有訂單' : '目前還沒有任何下訂'}</div>`;
    } catch (e) { alert(e.message); }
  }

  async function advance(id, to, label) {
    const consequential = (to === 'cancelled' || to === 'completed');
    if (consequential && !confirm('確定要「' + label + '」？\n（完成交車→車輛自動下架；取消→車輛復原現車在庫）')) return;
    try { await api('/api/admin/orders/' + id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: to }) }); loadList(); }
    catch (e) { alert(e.message); }
  }

  // ───── 訂單詳情視窗（點卡片開啟，內含推進狀態按鈕；資料用已載入的 CUR）─────
  let DETAIL_ID = null;
  function detailHTML(o) {
    const st = ST[o.status] || { l: o.status, c: '#888' };
    const acts = (NEXT[o.status] || []).map(([to, label, cls]) => `<button class="${cls}" onclick="advance('${o.id}','${to}','${label.replace(/[^一-龥A-Za-z]/g, '')}');closeDetail()">${label}</button>`).join('');
    const actsHtml = acts ? `<div class="oact">${acts}</div>` : `<div class="term" style="text-align:center;margin-top:0">此訂單已結案（${st.l}），無後續動作</div>`;
    return `
      <h3 class="oh">${esc(o.model_year)} ${esc(o.brand)} ${esc(o.model)}</h3>
      <div style="margin:8px 0"><span class="stbadge" style="background:${st.c}">${st.l}</span></div>
      <div class="ometa ometa-lg">
        <div class="k">車商</div><div class="v">${esc(o.company_name)}</div>
        <div class="k">訂金</div><div class="v">${nt(o.deposit_twd)}</div>
        <div class="k">鎖至</div><div class="v">${esc(o.locked_until) || '—'}</div>
        <div class="k">下訂時間</div><div class="v">${esc(o.created_at) || '—'}</div>
        <div class="k">訂單編號</div><div class="v">${esc(o.id)}</div>
      </div>
      <div class="seclab3">推進狀態</div>
      ${actsHtml}
      <button class="no fullbtn" onclick="closeDetail()">關閉</button>
    `;
  }
  function openDetail(id) {
    const o = CUR.find(x => x.id === id); if (!o) return;
    DETAIL_ID = id;
    g('detailBody').innerHTML = detailHTML(o);
    g('detailModal').style.display = 'flex';
    g('detailSheet').scrollTop = 0;
  }
  function closeDetail() { g('detailModal').style.display = 'none'; DETAIL_ID = null; }

  function boot() { if (!tok()) { show('login'); return; } show('main'); loadList(); }
  boot();
</script>
</body>
</html>
