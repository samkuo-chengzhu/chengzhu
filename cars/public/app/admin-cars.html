<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>車源管理｜橙築</title>
<link rel="stylesheet" href="app.css">
<style>
  .login{padding:38px 22px;max-width:420px;margin:0 auto}
  /* 後台：桌機網頁版型（覆蓋 app.css 的手機 460px 限制；前台 LIFF 頁不受影響） */
  .app{max-width:1100px}
  #list{display:grid;grid-template-columns:1fr;gap:12px}
  #list .ccard{margin-bottom:0}
  #list .empty{grid-column:1/-1}
  @media (min-width:760px){ #list{grid-template-columns:repeat(2,1fr)} .addbtn{width:auto;padding:13px 28px} .modal{align-items:center} .sheet{border-radius:16px;max-width:680px} }
  .anav{display:flex;gap:8px;padding:10px 16px 0}
  .anav a{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px}
  .anav a.on{color:#1a1306;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));border-color:transparent}
  .toolbar{display:flex;gap:8px;padding:12px 16px 4px}
  .toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font);font-size:13px}
  .toolbar input{flex:1}
  .toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--gold-deep)}
  .addbtn{width:calc(100% - 32px);margin:10px 16px 0;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#1a1306;border:none;border-radius:11px;padding:13px;font-weight:800;font-size:15px;font-family:var(--font);cursor:pointer}
  .ccard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:11px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
  .ccard:hover{border-color:var(--gold-deep);transform:translateY(-2px);box-shadow:0 14px 28px -20px rgba(0,0,0,.8)}
  .tap{color:var(--gold-bright);font-weight:700}
  .cthumb{width:92px;height:69px;border-radius:8px;object-fit:cover;background:#000;flex:0 0 auto}
  .cthumb.ph{display:grid;place-items:center;color:var(--muted2);font-size:10px;text-align:center;background:radial-gradient(120% 120% at 50% 0%,#202027,#0d0d10)}
  .cbody{flex:1;min-width:0}
  .cbody h3{font-size:14.5px;font-weight:700;line-height:1.3}
  .cprice{font-size:14px;font-weight:800;color:var(--gold-bright);margin-top:3px}
  .cprice.none{color:var(--muted2);font-weight:600;font-size:12px}
  .cmeta{font-size:11px;color:var(--muted);margin-top:3px}
  .cact{display:flex;gap:7px;margin-top:9px}
  .cact button{border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .cact .danger{color:var(--red)}
  .stbadge{font-size:10px;font-weight:800;color:#15130a;padding:2px 8px;border-radius:6px}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
  .logout{font-size:11px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:5px 11px}
  .hint{color:var(--muted2);font-size:12px;margin-top:14px;line-height:1.65}
  .hint code{color:var(--gold);background:var(--surface2);padding:1px 5px;border-radius:4px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:460px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheet h2{font-size:17px;font-weight:800;color:var(--gold-bright);margin-bottom:6px}
  .seclab{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
  .sheet input,.sheet select,.sheet textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--text);font-family:var(--font);font-size:14px}
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:none;border-color:var(--gold-deep)}
  .fld{margin-bottom:10px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-bottom:10px}
  .chk input{width:auto}
  .pstrip{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
  .pthumb{position:relative;width:72px;height:54px}
  .pthumb img{width:100%;height:100%;object-fit:cover;border-radius:7px}
  .pthumb .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg);font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center}
  .uplab{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px dashed var(--gold-deep);border-radius:10px;padding:14px;font-size:13px;color:var(--gold-bright);cursor:pointer}
  .savebar{display:flex;gap:10px;margin-top:18px}
  .savebar button{flex:1;border:none;border-radius:11px;padding:13px;font-weight:800;font-size:15px;font-family:var(--font);cursor:pointer}
  .ok{background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));color:#1a1306}
  .no{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  /* 車輛資訊視窗（點卡片開啟） */
  .dimg{width:100%;height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
  .dimg.ph2{display:grid;place-items:center;color:var(--muted2);font-size:13px;background:radial-gradient(120% 120% at 50% 0%,#202027,#0d0d10)}
  .dprice{font-size:17px;font-weight:800;color:var(--gold-bright);margin-top:4px}
  .dretail{font-size:12.5px;color:var(--muted);font-weight:600}
  .dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-top:14px;font-size:13.5px}
  .dl-k{color:var(--muted);white-space:nowrap}
  .dl-v{color:var(--text);font-weight:600;word-break:break-all}
  .tags-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tags-mini span{font-size:12px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">OB</div>
      <div><b>車源管理</b><small>ORANGE BUILDING MOTOR</small></div>
    </div>
    <div class="logout" id="logout" style="display:none" onclick="logout()">登出</div>
  </div>

  <div id="login" class="login" style="display:none">
    <div id="cfgwarn" style="display:none;background:#3a1414;border:1px solid var(--red);color:#ffb4b4;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:16px;line-height:1.65">⚠️ 偵測到後台密碼尚未設定。請先在電腦資料夾 chengzhu-CARS 執行 <code>npx wrangler secret put ADMIN_TOKEN</code>，設定後再登入。</div>
    <div class="field">
      <label>後台密碼</label>
      <input id="pw" type="password" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="submit-btn" onclick="doLogin()">登入</button>
  </div>

  <div id="main" style="display:none">
    <div class="anav">
      <a href="admin.html">👤 會員管理</a>
      <a href="admin-cars.html" class="on">🚗 車源管理</a>
      <a href="admin-orders.html">📦 訂單管理</a>
    </div>
    <div class="toolbar">
      <input id="q" placeholder="🔍 搜尋 廠牌 / 車型 / VIN" oninput="debouncedLoad()">
      <select id="f" onchange="loadList()">
        <option value="">全部狀態</option>
        <option value="in_stock">現車在庫</option>
        <option value="inspection">車測中</option>
        <option value="customs">報關中</option>
        <option value="shipping">船運中</option>
        <option value="reserved">預訂中</option>
        <option value="sold">已售出</option>
      </select>
    </div>
    <button class="addbtn" onclick="openNew()">＋ 新增車源</button>
    <button class="addbtn" style="background:var(--surface2);color:var(--gold-bright);border:1px solid var(--gold-deep)" onclick="rebuildMenu()">🔄 套用新版 LINE 圖文選單</button>
    <div id="list" style="padding:12px 16px 44px"></div>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <h2 id="formTitle">新增車源</h2>

    <div class="seclab" style="border-top:none;padding-top:0">基本</div>
    <div class="grid2">
      <div class="fld"><label>廠牌 *</label><input id="c_brand" placeholder="Mercedes-AMG"></div>
      <div class="fld"><label>車型 *</label><input id="c_model" placeholder="GLC 43 Coupé"></div>
      <div class="fld"><label>年式 *</label><input id="c_model_year" type="number" inputmode="numeric" placeholder="2025"></div>
      <div class="fld"><label>狀態</label><select id="c_status">
        <option value="in_stock">現車在庫</option>
        <option value="inspection">車測中</option>
        <option value="customs">報關中</option>
        <option value="shipping">船運中</option>
        <option value="reserved">預訂中</option>
        <option value="sold">已售出（下架）</option>
      </select></div>
      <div class="fld"><label>規格別</label><input id="c_region_spec" placeholder="韓規 / 日規"></div>
      <div class="fld"><label>里程 (km)</label><input id="c_mileage_km" type="number" inputmode="numeric" placeholder="18000"></div>
    </div>

    <div class="seclab">動力 / 規格</div>
    <div class="grid2">
      <div class="fld"><label>燃料</label><input id="c_fuel" placeholder="汽油"></div>
      <div class="fld"><label>排氣量 (cc)</label><input id="c_displacement_cc" type="number" inputmode="numeric"></div>
      <div class="fld"><label>驅動</label><input id="c_drivetrain" placeholder="4MATIC"></div>
      <div class="fld"><label>變速</label><input id="c_transmission" placeholder="9G 自手排"></div>
      <div class="fld"><label>引擎</label><input id="c_engine" placeholder="M139 2.0T"></div>
      <div class="fld"><label>馬力 (hp)</label><input id="c_horsepower" type="number" inputmode="numeric"></div>
      <div class="fld"><label>外觀色</label><input id="c_exterior_color"></div>
      <div class="fld"><label>內裝色</label><input id="c_interior_color"></div>
      <div class="fld"><label>輪胎</label><input id="c_tires" placeholder="前265/後295 R21"></div>
      <div class="fld"><label>生產日期</label><input id="c_production_date" placeholder="例：2020/05 或 2020（可只填年月，手動輸入）"></div>
    </div>
    <div class="fld"><label>車身號碼 VIN</label><input id="c_vin"></div>

    <div class="seclab">批發 / 條件</div>
    <div class="grid2">
      <div class="fld"><label>批發底價 (TWD)</label><input id="c_wholesale_price" type="number" inputmode="numeric"></div>
      <div class="fld"><label>建議零售 (TWD)</label><input id="c_suggested_retail" type="number" inputmode="numeric"></div>
      <div class="fld"><label>鎖車天數</label><input id="c_lock_days" type="number" inputmode="numeric" placeholder="3"></div>
      <div class="fld"><label>訂金 %</label><input id="c_deposit_pct" type="number" inputmode="numeric" placeholder="30"></div>
      <div class="fld"><label>到港(週)最短</label><input id="c_eta_weeks_min" type="number" inputmode="numeric"></div>
      <div class="fld"><label>到港(週)最長</label><input id="c_eta_weeks_max" type="number" inputmode="numeric"></div>
    </div>

    <div class="seclab">其他</div>
    <div class="chk"><input id="c_accident_free" type="checkbox" checked><label style="margin:0">無重大事故</label></div>
    <div class="fld"><label>配備亮點（一行一項）</label><textarea id="c_highlights" rows="3" placeholder="AMG 夜色套件&#10;360 環景&#10;HUD"></textarea></div>
    <div class="fld"><label>規格表（一行「項目：內容」）</label><textarea id="c_spec" rows="3" placeholder="年式產地：2025 德國&#10;內裝：黑色真皮"></textarea></div>
    <div class="grid2">
      <div class="fld"><label>Carfax 連結</label><input id="c_carfax_url" placeholder="https://"></div>
      <div class="fld"><label>解碼報告連結</label><input id="c_decode_url" placeholder="https://"></div>
    </div>

    <div id="photoSection">
      <div class="seclab">照片</div>
      <div id="photoNote" class="hint" style="margin:0 0 8px">先按「儲存」建立車源後，即可上傳照片。</div>
      <div class="pstrip" id="pstrip"></div>
      <label class="uplab" id="uplab" style="display:none">📷 上傳照片（可多選）
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="uploadPhotos(this.files)">
      </label>
    </div>

    <div class="savebar">
      <button class="ok" id="saveBtn" onclick="saveForm()">儲存</button>
      <button class="no" onclick="closeForm()">關閉</button>
    </div>
  </div>
</div>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()">
  <div class="sheet" id="detailSheet">
    <div id="detailBody"></div>
  </div>
</div>

<script>
  const TKEY = 'cz_admin';
  const STATUS = { reserved:{l:'預訂中',c:'#e0a13a'}, shipping:{l:'船運中',c:'#4a90e2'}, customs:{l:'報關中',c:'#a978e0'}, inspection:{l:'車測中',c:'#3fb6b0'}, in_stock:{l:'現車在庫',c:'#3fae6b'}, sold:{l:'已售出',c:'#777'} };
  let CUR = [], EDIT_ID = null, _t = null;
  const tok = () => { try { return sessionStorage.getItem(TKEY) || ''; } catch (e) { return ''; } };
  const g = id => document.getElementById(id);
  const val = id => g(id).value.trim();
  const numv = id => { const v = g(id).value.trim(); return v === '' ? null : Number(v); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function nt(n){ return (n==null)?'—':'NT$ '+Number(n).toLocaleString('en-US'); }
  function imgURL(u){ return (u && !/^(https?:\/\/|\/)/.test(u)) ? '/'+u : u; }

  function show(v){ g('login').style.display=v==='login'?'':'none'; g('main').style.display=v==='main'?'':'none'; g('logout').style.display=v==='main'?'':'none'; }
  function doLogin(){ const v=g('pw').value.trim(); if(!v) return; try{sessionStorage.setItem(TKEY,v);}catch(e){} boot(); }
  function logout(){ try{sessionStorage.removeItem(TKEY);}catch(e){} g('pw').value=''; show('login'); }

  async function api(path, opts){
    const o = opts||{}; o.headers = Object.assign({'X-Admin-Token':tok()}, o.headers||{});
    const r = await fetch(path, o);
    if (r.status===401){ logout(); throw new Error('密碼錯誤，或後台密碼（ADMIN_TOKEN）尚未設定'); }
    if (!r.ok) throw new Error('伺服器錯誤（'+r.status+'）');
    return r;
  }

  function card(c){
    const st = STATUS[c.status] || {l:c.status,c:'#777'};
    const thumb = c.cover ? `<img class="cthumb" src="${esc(imgURL(c.cover))}" alt="">` : `<div class="cthumb ph">無照片</div>`;
    const price = (c.wholesalePrice!=null) ? `<div class="cprice">批發 ${nt(c.wholesalePrice)}</div>` : `<div class="cprice none">批發價未設定</div>`;
    // 整張卡片可點 → 開「車輛資訊」視窗（內含編輯按鈕）
    return `<div class="ccard" onclick="openDetail('${c.id}')">
      ${thumb}
      <div class="cbody">
        <div><span class="stbadge" style="background:${st.c}">${st.l}</span></div>
        <h3>${esc(c.modelYear)||''} ${esc(c.brand)} ${esc(c.model)}</h3>
        ${price}
        <div class="cmeta">📷 ${c.photoCount} 張　·　<span class="tap">點卡片查看 / 編輯 ›</span></div>
      </div>
    </div>`;
  }

  async function loadList(){
    try{
      const q=(g('q').value||'').trim(), f=g('f').value;
      const r=await api('/api/admin/cars?status='+f+(q?'&q='+encodeURIComponent(q):''));
      CUR=await r.json();
      g('list').innerHTML = CUR.length ? CUR.map(card).join('') : `<div class="empty">${q||f?'查無符合的車源':'尚無車源，按上方「＋ 新增車源」開始'}</div>`;
    }catch(e){ alert(e.message); }
  }
  function debouncedLoad(){ clearTimeout(_t); _t=setTimeout(loadList,250); }

  function fillForm(d){
    const set=(id,v)=>{ g(id).value = (v==null?'':v); };
    set('c_brand',d.brand); set('c_model',d.model); set('c_model_year',d.model_year); g('c_status').value=d.status||'in_stock';
    set('c_region_spec',d.region_spec); set('c_mileage_km',d.mileage_km); set('c_fuel',d.fuel); set('c_displacement_cc',d.displacement_cc);
    set('c_drivetrain',d.drivetrain); set('c_transmission',d.transmission); set('c_engine',d.engine); set('c_horsepower',d.horsepower);
    set('c_exterior_color',d.exterior_color); set('c_interior_color',d.interior_color); set('c_tires',d.tires); set('c_production_date',d.production_date);
    set('c_vin',d.vin); set('c_wholesale_price',d.wholesale_price); set('c_suggested_retail',d.suggested_retail);
    set('c_lock_days',d.lock_days); set('c_deposit_pct',d.deposit_pct); set('c_eta_weeks_min',d.eta_weeks_min); set('c_eta_weeks_max',d.eta_weeks_max);
    g('c_accident_free').checked = d.accident_free==null ? true : !!d.accident_free;
    g('c_highlights').value = Array.isArray(d.highlights) ? d.highlights.join('\n') : '';
    g('c_spec').value = (d.spec && typeof d.spec==='object') ? Object.entries(d.spec).map(([k,v])=>k+'：'+v).join('\n') : '';
    set('c_carfax_url',d.carfax_url); set('c_decode_url',d.decode_url);
  }
  function openNew(){
    EDIT_ID=null; fillForm({status:'in_stock'}); g('c_accident_free').checked=true;
    g('formTitle').textContent='新增車源';
    g('photoNote').style.display=''; g('uplab').style.display='none'; g('pstrip').innerHTML='';
    g('modal').style.display='flex'; document.querySelector('.sheet').scrollTop=0;
  }
  async function openEdit(id){
    try{
      const d = await (await api('/api/admin/cars/'+id)).json();
      EDIT_ID=id; fillForm(d); g('formTitle').textContent='編輯車源';
      g('photoNote').style.display='none'; g('uplab').style.display='flex';
      renderPhotos(d.photos||[]);
      g('modal').style.display='flex'; document.querySelector('.sheet').scrollTop=0;
    }catch(e){ alert(e.message); }
  }
  function closeForm(){ g('modal').style.display='none'; EDIT_ID=null; }

  // ───── 車輛資訊視窗（點卡片開啟，內含編輯按鈕）─────
  let DETAIL_ID = null;
  function detailRow(k,v){ return (v!=null && v!=='') ? `<div class="dl-k">${esc(k)}</div><div class="dl-v">${esc(v)}</div>` : ''; }
  function detailHTML(d){
    const st = STATUS[d.status] || {l:d.status,c:'#777'};
    const photos = d.photos || [];
    const cover = photos[0] && photos[0].url;
    const img = cover ? `<img class="dimg" src="${esc(imgURL(cover))}" alt="">` : `<div class="dimg ph2">尚無照片</div>`;
    const price = (d.wholesale_price!=null) ? nt(d.wholesale_price) : '未設定';
    const retail = (d.suggested_retail!=null) ? `　·　建議零售 ${nt(d.suggested_retail)}` : '';
    const mi = (d.mileage_km!=null && d.mileage_km!=='') ? Number(d.mileage_km).toLocaleString('en-US')+' km' : '';
    const specRows = [
      ['年式', d.model_year], ['里程', mi], ['規格別', d.region_spec], ['燃料', d.fuel],
      ['驅動', d.drivetrain], ['變速', d.transmission], ['引擎', d.engine],
      ['馬力', d.horsepower ? d.horsepower+' hp' : ''], ['外觀色', d.exterior_color], ['內裝色', d.interior_color],
      ['輪胎', d.tires], ['生產日期', d.production_date], ['VIN', d.vin],
    ].map(([k,v])=>detailRow(k,v)).join('');
    const hl = (Array.isArray(d.highlights) && d.highlights.length)
      ? `<div class="seclab">配備亮點</div><div class="tags-mini">${d.highlights.map(h=>`<span>${esc(h)}</span>`).join('')}</div>` : '';
    const toggleBtn = d.status==='sold'
      ? `<button class="no" onclick="toggleStatus('${d.id}','in_stock');closeDetail()">重新上架</button>`
      : `<button class="no" onclick="toggleStatus('${d.id}','sold');closeDetail()">下架</button>`;
    return `${img}
      <h2 style="margin-top:14px">${esc(d.model_year)||''} ${esc(d.brand)} ${esc(d.model)}</h2>
      <div style="margin:8px 0"><span class="stbadge" style="background:${st.c}">${st.l}</span></div>
      <div class="dprice">批發 ${price}<span class="dretail">${retail}</span></div>
      <div class="cmeta" style="margin-top:6px">📷 共 ${photos.length} 張照片</div>
      <div class="dl">${specRows}</div>
      ${hl}
      <div class="savebar"><button class="ok" onclick="editFromDetail()">✎ 編輯這台車</button>${toggleBtn}</div>
      <div class="savebar" style="margin-top:8px">
        <button class="no" style="color:var(--red)" onclick="delCar('${d.id}');closeDetail()">刪除</button>
        <button class="no" onclick="closeDetail()">關閉</button>
      </div>`;
  }
  async function openDetail(id){
    DETAIL_ID = id;
    g('detailBody').innerHTML = '<div style="padding:34px 10px;text-align:center;color:var(--muted)">載入中…</div>';
    g('detailModal').style.display='flex'; g('detailSheet').scrollTop=0;
    try{
      const d = await (await api('/api/admin/cars/'+id)).json();
      g('detailBody').innerHTML = detailHTML(d);
    }catch(e){ g('detailBody').innerHTML = `<div style="padding:24px 10px;color:var(--red)">載入失敗：${esc(e.message)}</div><div class="savebar"><button class="no" onclick="closeDetail()">關閉</button></div>`; }
  }
  function closeDetail(){ g('detailModal').style.display='none'; DETAIL_ID=null; }
  function editFromDetail(){ const id=DETAIL_ID; closeDetail(); openEdit(id); }

  function collect(){
    const spec={};
    val('c_spec').split('\n').forEach(line=>{ const m=line.split(/[:：]/); if(m.length>=2){ const k=m[0].trim(); const v=m.slice(1).join('：').trim(); if(k) spec[k]=v; } });
    return {
      brand:val('c_brand'), model:val('c_model'), model_year:numv('c_model_year'), status:g('c_status').value,
      region_spec:val('c_region_spec'), mileage_km:numv('c_mileage_km'), fuel:val('c_fuel'), displacement_cc:numv('c_displacement_cc'),
      drivetrain:val('c_drivetrain'), transmission:val('c_transmission'), engine:val('c_engine'), horsepower:numv('c_horsepower'),
      exterior_color:val('c_exterior_color'), interior_color:val('c_interior_color'), tires:val('c_tires'), production_date:val('c_production_date'),
      vin:val('c_vin'), wholesale_price:numv('c_wholesale_price'), suggested_retail:numv('c_suggested_retail'),
      lock_days:numv('c_lock_days'), deposit_pct:numv('c_deposit_pct'), eta_weeks_min:numv('c_eta_weeks_min'), eta_weeks_max:numv('c_eta_weeks_max'),
      accident_free: g('c_accident_free').checked?1:0,
      highlights: val('c_highlights').split('\n').map(s=>s.trim()).filter(Boolean),
      spec
    };
  }
  async function saveForm(){
    const body=collect();
    if(!body.brand||!body.model||!body.model_year){ alert('請填寫廠牌、車型、年式（必填）'); return; }
    try{
      if(EDIT_ID){
        await api('/api/admin/cars/'+EDIT_ID+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        closeForm(); loadList();
      }else{
        const r=await (await api('/api/admin/cars',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
        EDIT_ID=r.id; g('formTitle').textContent='編輯車源';
        g('photoNote').style.display='none'; g('uplab').style.display='flex'; renderPhotos([]);
        loadList();
        alert('已新增！現在可以上傳照片了。');
      }
    }catch(e){ alert(e.message); }
  }

  async function toggleStatus(id,to){
    const word = to==='sold'?'下架（標示已售出）':'重新上架';
    if(!confirm('確定要'+word+'？')) return;
    try{ await api('/api/admin/cars/'+id+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:to})}); loadList(); }catch(e){ alert(e.message); }
  }
  async function delCar(id){
    const c=CUR.find(x=>x.id===id)||{};
    if(!confirm('確定刪除「'+(c.brand||'')+' '+(c.model||'此車')+'」？照片也會一併刪除，無法復原。')) return;
    try{ await api('/api/admin/cars/'+id+'/delete',{method:'POST'}); loadList(); }catch(e){ alert(e.message); }
  }

  function renderPhotos(photos){
    g('pstrip').innerHTML = photos.map(p=>`<div class="pthumb"><img src="${esc(imgURL(p.url))}" alt=""><div class="x" onclick="delPhoto('${p.id}')">✕</div></div>`).join('');
  }
  async function reloadPhotos(){
    if(!EDIT_ID) return;
    try{ const d=await (await api('/api/admin/cars/'+EDIT_ID)).json(); renderPhotos(d.photos||[]); }catch(e){}
  }
  async function uploadPhotos(files){
    if(!EDIT_ID||!files.length) return;
    g('uplab').style.opacity='.5';
    for(const f of files){
      const fd=new FormData(); fd.append('file',f);
      try{ const r=await fetch('/api/admin/cars/'+EDIT_ID+'/photos',{method:'POST',headers:{'X-Admin-Token':tok()},body:fd}); if(!r.ok) throw 0; }
      catch(e){ alert('上傳失敗：'+f.name); }
    }
    g('uplab').style.opacity='1'; g('photoInput').value=''; reloadPhotos(); loadList();
  }
  async function delPhoto(pid){
    if(!EDIT_ID) return;
    try{ await api('/api/admin/cars/'+EDIT_ID+'/photos/'+pid+'/delete',{method:'POST'}); reloadPhotos(); loadList(); }catch(e){ alert(e.message); }
  }

  async function checkConfig(){ try{ const r=await fetch('/api/config'); if(r.ok){ const j=await r.json(); g('cfgwarn').style.display = j.adminConfigured ? 'none' : ''; } }catch(e){} }
  async function rebuildMenu(){
    if(!confirm('要更新 LINE 圖文選單嗎？\n會套用新版順序（現車在庫→車測中→報關中→船運中→預訂中→會員專區），約幾秒生效。')) return;
    try{
      const r = await (await api('/api/admin/richmenu/rebuild',{method:'POST'})).json();
      if(r.ok) alert('✅ 圖文選單已更新！請完全關掉再重開 LINE 對話查看。');
      else alert('更新失敗：'+(r.error||'未知')+(r.detail?('\n'+JSON.stringify(r.detail)):''));
    }catch(e){ alert(e.message); }
  }
  window.rebuildMenu = rebuildMenu;
  function boot(){ if(!tok()){ show('login'); checkConfig(); return; } show('main'); loadList(); }
  boot();
</script>
</body>
</html>
