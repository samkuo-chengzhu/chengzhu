<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>批發車源｜橙築車商批發</title>
<link rel="stylesheet" href="app.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="app">
  <div id="rsw"></div>
  <div class="demo-bar">🔧 DEMO 示意頁 ─ 除 GLC43（真實照片）外其餘為示意車；切換上方視角看批發價差異</div>

  <div class="topbar">
    <div class="brand">
      <div class="back" onclick="location.href='home.html'">‹</div>
      <div class="logo">OB</div>
      <div><b>橙築國際汽車</b><small>ORANGE BUILDING MOTOR</small></div>
    </div>
    <div class="dealer-tag" id="idtag">🔒 車商批發</div>
  </div>

  <div class="list-head">
    <h2>批發車源</h2>
    <div class="cnt" id="cnt">載入中…</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="clist" id="clist"></div>
</div>

<script src="app.js"></script>
<script>
  let CARS = [], active = 'all';

  function tabList() {
    const counts = { all: CARS.length };
    PIPELINE.forEach(s => counts[s] = CARS.filter(c => c.status === s).length);
    const order = ['all', ...PIPELINE.filter(s => counts[s] > 0)];
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    order.forEach(s => {
      const el = document.createElement('div');
      el.className = 'tab' + (s === active ? ' active' : '');
      const label = s === 'all' ? '全部' : STATUS[s].label;
      el.innerHTML = label + '<span class="n">' + counts[s] + '</span>';
      el.onclick = () => { active = s; tabList(); renderCards(); };
      tabs.appendChild(el);
    });
  }

  function priceRow(c) {
    const pf = profitText(c);
    if (canSeeWholesale(c)) {
      return `<div class="wp"><span class="u">批發</span>${nt(c.wholesalePrice)}<span class="demo-pill">示意</span></div>
        ${pf ? `<div class="pf">${pf}</div>` : ''}`;
    }
    return `<div class="wp locked">🔒 批發價（限車商）</div>`;
  }

  function card(c) {
    const st = STATUS[c.status];
    const cover = coverOf(c);
    const img = cover
      ? `<img src="${cover}" alt=""><div class="ov-cnt">${c.photos ? c.photos.length : 1} 張</div>`
      : `<div class="ph">${CAR_SVG}<div class="phl">示意車源 · 實車照片陸續更新</div></div>`;
    const sub = `${km(c.mileageKm)} · ${c.regionSpec || ''} · ${c.fuel || ''} · ${c.exteriorColor || ''}`;
    return `<div class="ccard" onclick="location.href='detail.html?id=${c.id}'">
      <div class="ccard-img">
        ${img}
        <div class="ov-stat"><span class="stat-solid" style="--st:${st.color}">● ${st.label}</span></div>
      </div>
      <div class="ccard-body">
        <h3>${c.modelYear} ${c.brand} ${c.model}</h3>
        <div class="csub">${sub}</div>
        <div class="ccard-price">${priceRow(c)}</div>
      </div>
    </div>`;
  }

  function renderCards() {
    const list = active === 'all' ? CARS.slice() : CARS.filter(c => c.status === active);
    const rank = { in_stock: 0, inspection: 1, customs: 2, shipping: 3, reserved: 4, sold: 5 };
    list.sort((a, b) => (rank[a.status] - rank[b.status]) || ((a.placeholder ? 1 : 0) - (b.placeholder ? 1 : 0)));
    document.getElementById('clist').innerHTML = list.map(card).join('');
  }

  bootstrap().then(() => {
  // 會員專區在 LINE 內：未驗證車商導向申請頁
  if (getParam('goto') === 'apply' && !isDealer()) { location.replace('apply.html'); return; }
  mountRoleSwitcher();
  document.getElementById('idtag').textContent = isDealer() ? '🔓 車商批發' : '🔒 車商批發';

  loadCars().then(cars => {
    CARS = cars;
    const init = getParam('status');
    if (init && PIPELINE.includes(init)) active = init;
    const who = ROLE_LABEL[getRole()];
    const hint = isDealer() ? '' : `（以 ${who} 瀏覽，批發價已隱藏）`;
    document.getElementById('cnt').innerHTML = `共 ${cars.length} 台 · 日本 / 韓國進口直送 ${hint ? '<span style="color:var(--gold)">· ' + hint + '</span>' : ''}`;
    tabList();
    renderCards();
  });
  });
</script>
</body>
</html>
