<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>車源詳情｜橙築車商批發</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app"></div>

<script src="app.js"></script>
<script>
function galleryHTML(car, st) {
  if (car.photos && car.photos.length) {
    return `<div class="gallery">
      <div class="hero">
        <img id="hero" src="${car.photos[0].url}" alt="">
        <div class="chip-status"><span class="stat-solid" style="--st:${st.color}">● ${st.label}</span></div>
        <div class="fav">♡</div>
        <div class="count" id="count">1 / ${car.photos.length}</div>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>`;
  }
  return `<div class="gallery"><div class="hero">
    <div class="ph">${CAR_SVG}</div>
    <div class="chip-status"><span class="stat-solid" style="--st:${st.color}">● ${st.label}</span></div>
  </div></div>`;
}

function pipelineHTML(car) {
  if (car.status === 'sold') return '';
  const idx = PIPELINE.indexOf(car.status);
  const steps = PIPELINE.map((s, i) => {
    const cls = i < idx ? 'done' : (i === idx ? 'active' : '');
    const styl = i === idx ? `style="--st:${STATUS[s].color}"` : '';
    const mark = i < idx ? '✓' : '●';
    return `<div class="pstep ${cls}" ${styl}><div class="pdot">${i <= idx ? mark : ''}</div><div class="pl">${STATUS[s].label}</div></div>`;
  }).join('');
  return `<div class="section"><div class="sec-h">車輛進度</div><div class="pipe">${steps}</div></div>`;
}

function conditionHTML(car) {
  const cells = [];
  if (car.vinDisplay) cells.push(['車身號碼 VIN', car.vinDisplay]);
  if (car.productionDate) cells.push(['生產日期', car.productionDate]);
  const eng = car.engine || (car.displacementCc ? car.displacementCc.toLocaleString() + ' c.c.' : null);
  if (eng) cells.push(['引擎', eng]);
  if (car.horsepower) cells.push(['最大馬力', car.horsepower + ' hp']);
  const dt = [car.transmission, car.drivetrain].filter(Boolean).join(' · ');
  if (dt) cells.push(['變速 / 驅動', dt]);
  const tires = car.tires || car.regionSpec;
  if (tires) cells.push(['輪胎 / 規格', tires]);
  if (!cells.length) return '';
  const grid = cells.map(c => `<div class="cell"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
  const verify = car.accidentFree
    ? `<div class="verify-row"><span class="ic">✔</span><span>原廠出廠 · 進口一手 · 無重大事故（示意）· 含 Carfax 與全配備解碼報告</span></div>` : '';
  return `<div class="section" style="padding-top:4px"><div class="sec-h">車況 / 車輛資訊</div><div class="grid2">${grid}</div>${verify}</div>`;
}

// ── 批發價 / CTA / 底部：依身分 gating ──
function priceBlock(car, canSee, role) {
  if (canSee) {
    const profit = (car.suggestedRetail && car.wholesalePrice) ? Math.round((car.suggestedRetail - car.wholesalePrice) / 10000) : null;
    const retail = car.suggestedRetail ? `<div class="retail">建議零售 <s>${nt(car.suggestedRetail)}</s> ─ 你的利潤空間 <b>約 ${profit} 萬</b></div>` : '';
    const eta = car.status === 'in_stock' ? '現車可交' : (car.etaWeeksMin ? `約 ${car.etaWeeksMin}-${car.etaWeeksMax} 週` : '—');
    return `<div class="price-card">
      <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 批發底價 · 僅限已驗證車商</div>
      <div class="amt">${nt(car.wholesalePrice)} <span class="demo">示意</span></div>
      ${retail}
      <div class="terms">
        <div class="term"><div class="t1">鎖車保留</div><div class="t2">${car.lockDays || 3} 天</div></div>
        <div class="term"><div class="t1">訂金</div><div class="t2">${car.depositPct || 30}%</div></div>
        <div class="term"><div class="t1">預計到港</div><div class="t2">${eta}</div></div>
      </div>
    </div>`;
  }
  const pendingTxt = '您的車商申請審核中，通過後即可看到批發底價並線上下訂鎖車';
  const guestTxt = '申請成為車商，解鎖所有車源的批發底價與線上下訂鎖車';
  return `<div class="lock-card">
    <div class="lk">🔒</div>
    <div class="lt">批發底價僅限已驗證車商</div>
    <div class="ls">${role === 'pending' ? pendingTxt : guestTxt}</div>
    ${role === 'pending' ? '' : `<button class="lbtn" onclick="location.href='apply.html'">⭐ 申請成為車商</button>`}
  </div>`;
}

function ctaBlock(car, canSee, role) {
  if (canSee) {
    return `<div class="cta">
      <button class="btn btn-ghost" onclick="alert('（DEMO）開啟 LINE 一對一詢價')">💬 詢價</button>
      <button class="btn btn-primary" onclick="alert('（DEMO）下訂鎖車：填車商下訂單 → 付 ${car.depositPct || 30}% 訂金 → 鎖車 ${car.lockDays || 3} 天')">🔑 下訂鎖車</button>
    </div>
    <div class="cta-note">下訂即鎖車 ${car.lockDays || 3} 天，付訂金後排船；到港前可複驗車況再確認尾款</div>`;
  }
  if (role === 'pending') {
    return `<div class="cta">
      <button class="btn btn-ghost" onclick="alert('（DEMO）詢價')">💬 詢價</button>
      <button class="btn btn-primary btn-disabled" disabled>⏳ 車商審核中</button>
    </div>`;
  }
  return `<div class="cta">
    <button class="btn btn-ghost" onclick="alert('（DEMO）詢價')">💬 詢價</button>
    <button class="btn btn-primary" onclick="location.href='apply.html'">⭐ 申請成為車商</button>
  </div>`;
}

function stickyBlock(car, canSee, role) {
  if (canSee) {
    return `<div class="sticky-buy"><div class="sp"><div class="s1">批發底價（示意）</div><div class="s2">${nt(car.wholesalePrice)}</div></div>
      <button class="sbtn" onclick="alert('（DEMO）下訂鎖車')">下訂鎖車</button></div>`;
  }
  const btn = role === 'pending'
    ? `<button class="sbtn btn-disabled" disabled>審核中</button>`
    : `<button class="sbtn" onclick="location.href='apply.html'">申請成為車商</button>`;
  return `<div class="sticky-buy"><div class="sp"><div class="s1">🔒 批發價未解鎖</div>
    <div class="s2" style="font-size:14px;color:var(--muted)">限已驗證車商</div></div>${btn}</div>`;
}

function render(car) {
  const st = STATUS[car.status];
  const role = getRole();
  const canSee = canSeeWholesale(car);
  document.documentElement.style.setProperty('--st', st.color);

  const badges = [`<span class="badge gold">${car.modelYear} 年式</span>`, `<span class="badge">${km(car.mileageKm)}</span>`];
  if (car.fuel) badges.push(`<span class="badge">${car.fuel}</span>`);
  if (car.drivetrain) badges.push(`<span class="badge">${car.drivetrain}</span>`);
  if (car.regionSpec) badges.push(`<span class="badge">${car.regionSpec}進口</span>`);

  const highlights = (car.highlights && car.highlights.length)
    ? `<div class="section" style="padding-top:4px"><div class="sec-h">配備亮點</div><div class="tags">${car.highlights.map(h => `<span class="tag">${h}</span>`).join('')}</div></div>` : '';

  let specBlock = '';
  if (car.spec && Object.keys(car.spec).length) {
    const rows = Object.entries(car.spec).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    const docs = [];
    if (car.decodeUrl) docs.push(`<div class="doc-link" onclick="alert('（DEMO）開啟原廠全配備解碼 PDF')"><div class="l"><span class="e">📄</span><div>原廠全配備解碼報告<br><span style="color:var(--muted);font-size:11px">outvin · 出廠配備清單</span></div></div><span class="arr">查看 ›</span></div>`);
    if (car.carfaxUrl) docs.push(`<div class="doc-link" onclick="alert('（DEMO）開啟 Carfax 車史報告')"><div class="l"><span class="e">🛡️</span><div>Carfax 車史報告<br><span style="color:var(--muted);font-size:11px">里程 · 事故 · 過戶紀錄</span></div></div><span class="arr">查看 ›</span></div>`);
    specBlock = `<div class="section" style="padding-top:4px"><div class="sec-h">原廠規格</div><table class="spec-tbl">${rows}</table>${docs.join('')}</div>`;
  }

  const phNote = car.placeholder ? `<div class="cta-note" style="color:var(--gold)">＊此為示意車源，實車照片與車況報告陸續更新</div>` : '';

  document.getElementById('app').innerHTML = `
    <div id="rsw"></div>
    <div class="demo-bar">🔧 DEMO 示意頁 ─ 切換上方視角，看散客／車商批發價差異</div>
    <div class="topbar">
      <div class="brand">
        <div class="back" onclick="location.href='list.html'">‹</div>
        <div class="logo">OB</div>
        <div><b>橙築國際汽車</b><small>ORANGE BUILDING MOTOR</small></div>
      </div>
      <div class="dealer-tag">${canSee ? '🔓 車商批發' : '🔒 車商批發'}</div>
    </div>

    ${galleryHTML(car, st)}

    <div class="title">
      <h1>${car.modelYear} ${car.brand} ${car.model}</h1>
      <div class="sub">${car.regionSpec || ''}進口 · ${car.exteriorColor || ''}${car.interiorColor ? ' / ' + car.interiorColor : ''}</div>
      <div class="badges">${badges.join('')}</div>
    </div>

    ${priceBlock(car, canSee, role)}
    ${ctaBlock(car, canSee, role)}
    ${phNote}
    ${pipelineHTML(car)}
    ${conditionHTML(car)}
    ${highlights}
    ${specBlock}

    <div class="foot">
      <div class="fl">橙築國際汽車</div>
      <div class="fs">ORANGE BUILDING MOTOR</div>
      <p>本頁為車商批發專區內容，批發價僅向已驗證車商顯示<br>日本 · 韓國進口車代辦 ─ 標車 / 海運 / 報關 / 驗車 一條龍</p>
    </div>

    ${stickyBlock(car, canSee, role)}`;

  mountRoleSwitcher();

  if (car.photos && car.photos.length) {
    const hero = document.getElementById('hero'), thumbs = document.getElementById('thumbs'), count = document.getElementById('count');
    car.photos.forEach((p, i) => {
      const t = document.createElement('img');
      t.src = p.url; t.alt = p.caption || ''; if (i === 0) t.className = 'active';
      t.onclick = () => {
        hero.src = p.url; count.textContent = (i + 1) + ' / ' + car.photos.length;
        thumbs.querySelectorAll('img').forEach(x => x.classList.remove('active'));
        t.classList.add('active'); t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      };
      thumbs.appendChild(t);
    });
  }
}

loadCar(getParam('id')).then(render);
</script>
</body>
</html>
